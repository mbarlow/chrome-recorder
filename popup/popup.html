<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chrome Recorder</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 280px;
                padding: 16px;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #FFFFFF;
                color: #111;
            }

            .header {
                margin-bottom: 14px;
            }

            .header h1 {
                font-size: 15px;
                font-weight: 600;
                color: #111;
            }

            .status {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 14px;
            }

            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #22C55E;
                flex-shrink: 0;
                transition: background 0.2s ease;
            }

            .status-dot.recording {
                background: #EF4444;
            }

            .status-text {
                font-size: 13px;
                font-weight: 500;
                color: #555;
                transition: color 0.2s ease;
            }

            .timer {
                font-family: 'JetBrains Mono', monospace;
                font-size: 32px;
                font-weight: 500;
                text-align: center;
                padding: 12px 0;
                color: #111;
                display: none;
                transition: color 0.2s ease;
            }

            .timer.visible {
                display: block;
            }

            .toggle-btn {
                display: block;
                width: 100%;
                padding: 10px 0;
                border: 1px solid #E5E7EB;
                border-radius: 8px;
                font-family: 'Inter', sans-serif;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                background: #1A1A1A;
                color: #FFFFFF;
                transition: background 0.15s ease, border-color 0.15s ease;
            }

            .toggle-btn:hover {
                background: #333;
            }

            .toggle-btn.recording {
                background: #EF4444;
                border-color: #EF4444;
                color: #FFFFFF;
            }

            .toggle-btn.recording:hover {
                background: #DC2626;
                border-color: #DC2626;
            }

            .toggle-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .webcam {
                margin-bottom: 14px;
                padding: 12px;
                border: 1px solid #E5E7EB;
                border-radius: 8px;
            }

            .webcam-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: pointer;
            }

            .webcam-label {
                font-size: 13px;
                font-weight: 500;
                color: #111;
            }

            #webcam-toggle {
                width: 16px;
                height: 16px;
                accent-color: #EF4444;
                cursor: pointer;
            }

            .corners {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                margin-top: 10px;
            }

            .corners button {
                font-size: 16px;
                line-height: 1;
                padding: 8px 0;
                border: 1px solid #E5E7EB;
                border-radius: 6px;
                background: #FFFFFF;
                color: #9CA3AF;
                cursor: pointer;
                transition: all 0.15s ease;
            }

            .corners button:hover {
                border-color: #9CA3AF;
            }

            .corners button.active {
                background: #1A1A1A;
                border-color: #1A1A1A;
                color: #FFFFFF;
            }

            .corners.disabled {
                opacity: 0.4;
                pointer-events: none;
            }

            .hint {
                margin-top: 8px;
                font-size: 11px;
                color: #EF4444;
                min-height: 0;
            }

            .hint:empty {
                display: none;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background: #1A1A1A;
                    color: #E5E5E5;
                }

                .header h1 {
                    color: #E5E5E5;
                }

                .status-text {
                    color: #999;
                }

                .timer {
                    color: #E5E5E5;
                }

                .toggle-btn {
                    background: #333;
                    border-color: #333;
                    color: #E5E5E5;
                }

                .toggle-btn:hover {
                    background: #444;
                }

                .toggle-btn.recording {
                    background: #EF4444;
                    border-color: #EF4444;
                    color: #FFFFFF;
                }

                .toggle-btn.recording:hover {
                    background: #DC2626;
                    border-color: #DC2626;
                }

                .webcam {
                    border-color: #333;
                }

                .webcam-label {
                    color: #E5E5E5;
                }

                .corners button {
                    background: #1A1A1A;
                    border-color: #333;
                    color: #777;
                }

                .corners button:hover {
                    border-color: #666;
                }

                .corners button.active {
                    background: #E5E5E5;
                    border-color: #E5E5E5;
                    color: #1A1A1A;
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>Chrome Recorder</h1>
        </div>

        <div class="status">
            <div class="status-dot" id="status-dot"></div>
            <span class="status-text" id="status-text">Ready</span>
        </div>

        <div class="timer" id="timer">00:00</div>

        <div class="webcam">
            <label class="webcam-row">
                <span class="webcam-label">Webcam overlay</span>
                <input type="checkbox" id="webcam-toggle" />
            </label>
            <div class="corners" id="corners">
                <button data-corner="tl" title="Top left">◤</button>
                <button data-corner="tr" title="Top right">◥</button>
                <button data-corner="bl" title="Bottom left">◣</button>
                <button data-corner="br" title="Bottom right">◢</button>
            </div>
            <p class="hint" id="webcam-hint"></p>
        </div>

        <button class="toggle-btn" id="toggle-btn">Start Recording</button>

        <script src="popup.js"></script>
    </body>
</html>
